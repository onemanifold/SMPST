name: CI/CD

on:
  push:
    branches:
      - main

# Sets permissions for deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "ci-cd"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run golden tests
        run: npm run test:golden

      - name: Check for snapshot changes
        run: |
          if git diff --exit-code tests/golden/snapshots/; then
            echo "✅ No snapshot changes - golden tests passed!"
          else
            echo "❌ Snapshots changed! This indicates breaking changes."
            echo ""
            echo "Changed files:"
            git diff --name-only tests/golden/snapshots/
            echo ""
            echo "If these changes are intentional (new language feature):"
            echo "  1. Review the diff carefully"
            echo "  2. Run: npm run test:golden:update"
            echo "  3. Commit the updated snapshots"
            echo ""
            echo "Diff:"
            git diff tests/golden/snapshots/
            exit 1
          fi

  store-contracts:
    runs-on: ubuntu-latest
    name: Verify Store Backend Contracts

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run store contract tests
        run: |
          echo "🔍 Verifying stores faithfully implement backend..."
          npm run test -- src/lib/stores/__tests__ --run --reporter=verbose

      - name: Check for incomplete implementations
        if: failure()
        run: |
          echo "❌ STORE CONTRACT VIOLATION DETECTED"
          echo ""
          echo "One or more stores are not faithfully implementing backend logic."
          echo ""
          echo "Common issues:"
          echo "  • Ignoring backend error returns"
          echo "  • Not exposing all backend properties to UI"
          echo "  • Missing stores for new backend features"
          echo ""
          echo "📖 See .claude/store-development-protocol.md for guidance"
          echo ""
          exit 1

      - name: Report success
        if: success()
        run: |
          echo "✅ All stores faithfully implement backend contracts"
          echo "   Frontend will properly reflect backend behavior to users"

  e2e:
    runs-on: ubuntu-latest
    needs: [test, store-contracts]
    name: E2E Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [test, store-contracts, e2e]
    name: Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    name: Deploy

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
