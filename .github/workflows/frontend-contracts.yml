name: Frontend Contract Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  store-contracts:
    runs-on: ubuntu-latest
    name: Verify Store Backend Contracts

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run store contract tests
        run: |
          echo "🔍 Verifying stores faithfully implement backend..."
          npm run test -- src/lib/stores/__tests__ --run --reporter=verbose

      - name: Check for incomplete implementations
        if: failure()
        run: |
          echo "❌ STORE CONTRACT VIOLATION DETECTED"
          echo ""
          echo "One or more stores are not faithfully implementing backend logic."
          echo ""
          echo "Common issues:"
          echo "  • Ignoring backend error returns"
          echo "  • Not exposing all backend properties to UI"
          echo "  • Missing stores for new backend features"
          echo ""
          echo "📖 See .claude/store-development-protocol.md for guidance"
          echo ""
          exit 1

      - name: Report success
        if: success()
        run: |
          echo "✅ All stores faithfully implement backend contracts"
          echo "   Frontend will properly reflect backend behavior to users"
